<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        class="card__product-image"
        src="../src/images/imac.jpeg"
        alt="iMac Image"
      />

      <h2 class="card__title">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </h2>

      <p class="card__code">Product code: 195434</p>

      <div class="card__review">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <div class="card__review-reviews">Reviews: 5</div>
      </div>

      <div class="card__price">
        <p class="card__price-description">Price:</p>
        <p class="card__price-value">$2,199</p>
      </div>

      <div
        class="card__button"
        href="#"
        data-qa="hover"
      >
        Buy
      </div>
    </div>
  </body>
</html>
